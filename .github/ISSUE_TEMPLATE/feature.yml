name: 기능 개발
description: 생존일기 웹 프런트엔드 기능을 제안하거나 구현합니다.
title: '[P1] '
labels: []
body:
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 - 핵심 사용 흐름
        - P1 - 주요 가치 완성
        - P2 - 후속 확장
    validations:
      required: true
  - type: dropdown
    id: feature
    attributes:
      label: 담당 기능
      options:
        - 홈·오늘 예산
        - 지출 등록
        - 지출 통계
        - 정책 추천
        - 절약 지도
        - 커뮤니티
        - 공통
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 목표
      description: 사용자가 무엇을 할 수 있어야 하는지 간단히 작성해 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 구현 범위
      value: |
        - 구현 항목을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      value: |
        - [ ] 완료 조건을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 백엔드·앱 의존성
      description: 필요한 Spring Boot API나 Flutter 앱 작업을 적어 주세요.
      placeholder: 없음
